apiVersion: scaffolder.backstage.io/v1beta3
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-template
kind: Template
metadata:
  name: nodejs-website-template
  title: Node.js Website Template
  description: A template for creating a Node.js Express website with TechDocs documentation
spec:
  owner: user:guest
  type: website

  # These parameters are used to generate the input form in the frontend, and are
  # used to gather input data for the execution of the template.
  parameters:
    - title: Fill in some steps
      required:
        - name
        - description
        - owner
      properties:
        name:
          title: Component Name
          type: string
          description: Unique name of the component (e.g., demo-service)
          ui:autofocus: true
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          patternErrorMessage: 'Name must be lowercase and may contain hyphens'
        description:
          title: Description
          type: string
          description: Brief description of the component
        owner:
          title: Owner
          type: string
          description: Owner of the component (e.g., user:guest or team:platform)
          default: user:guest
    - title: Choose a location (Optional - for GitHub integration)
      properties:
        repoUrl:
          title: Repository Location
          type: string
          description: GitHub repository URL (optional for local demo)
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  # These steps are executed in the scaffolder backend, using data that we gathered
  # via the parameters above.
  steps:
    # Each step executes an action, in this case one templates files into the working directory.
    - id: fetch-base
      name: Fetch Base
      action: fetch:template
      input:
        url: ./content
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}

    # Publish to GitHub if repoUrl is provided
    - id: publish
      name: Publish
      action: publish:github
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: 'main'

    # Register the component in the catalog
    - id: register
      name: Register
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

    # Notify the user that the template has completed
    - id: notify
      name: Notify
      action: notification:send
      input:
        recipients: entity
        entityRefs:
          - ${{ parameters.owner }}
        title: 'Component created successfully'
        info: 'Your Node.js website component "${{ parameters.name }}" has been created'
        severity: 'success'

  # Outputs are displayed to the user after a successful execution of the template.
  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
